<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOW OF SALEM — CREATE · DISCOVER · EXPERIENCE</title>
<meta name="description" content="A digital creation universe. Upload, discover, and experience art, music, video, and more.">
<meta name="theme-color" content="#000008">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     SHADOW OF SALEM APP SHELL
═══════════════════════════════════════════════════ -->

<!-- NAV SIDEBAR -->
<nav id="omega-nav" class="omega-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-brand" onclick="navigate('stream')">
    <div class="nav-logo">Ω</div>
    <div class="nav-wordmark">SHADOW OF SALEM</div>
  </div>
  <div class="nav-links">
    <button class="nav-link active" data-page="stream" onclick="navigate('stream')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Stream</span>
    </button>
    <button class="nav-link" data-page="explore" onclick="navigate('explore')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-link" data-page="music" onclick="navigate('music')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Music</span>
    </button>
    <button class="nav-link" data-page="video" onclick="navigate('video')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      <span>Video</span>
    </button>
    <button class="nav-link" data-page="art" onclick="navigate('art')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>
      <span>Art</span>
    </button>
    <button class="nav-link" data-page="collections" onclick="navigate('collections')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Collections</span>
    </button>
    <button class="nav-link nav-link--create" data-page="create" onclick="navigate('create')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Create</span>
    </button>
    <button class="nav-link" data-page="search" onclick="navigate('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="nav-link" data-page="profile" onclick="navigate('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-auth-label>Sign In</span>
    </button>
  </div>
</nav>

<!-- MOBILE TOP BAR -->
<header class="mobile-header">
  <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Open navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="mobile-brand" onclick="navigate('stream')">Ω SHADOW OF SALEM</div>
  <button class="mobile-create-btn" onclick="navigate('create')" aria-label="Create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </button>
</header>

<!-- MOBILE NAV OVERLAY -->
<div id="mobile-nav-overlay" class="mobile-nav-overlay hidden" onclick="closeMobileNav()"></div>
<div id="mobile-nav-drawer" class="mobile-nav-drawer">
  <div class="nav-brand" onclick="navigate('stream');closeMobileNav()">
    <div class="nav-logo">Ω</div>
    <div class="nav-wordmark">SHADOW OF SALEM</div>
  </div>
  <div class="nav-links">
    <button class="nav-link active" data-mobile-page="stream" onclick="navigate('stream');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Stream</span></button>
    <button class="nav-link" data-mobile-page="explore" onclick="navigate('explore');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg><span>Explore</span></button>
    <button class="nav-link" data-mobile-page="music" onclick="navigate('music');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button>
    <button class="nav-link" data-mobile-page="video" onclick="navigate('video');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg><span>Video</span></button>
    <button class="nav-link" data-mobile-page="art" onclick="navigate('art');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg><span>Art</span></button>
    <button class="nav-link" data-mobile-page="collections" onclick="navigate('collections');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Collections</span></button>
    <button class="nav-link nav-link--create" data-mobile-page="create" onclick="navigate('create');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Create</span></button>
    <button class="nav-link" data-mobile-page="search" onclick="navigate('search');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span></button>
    <button class="nav-link" data-mobile-page="profile" onclick="navigate('profile');closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span data-auth-label>Sign In</span></button>
  </div>
</div>

<!-- MAIN CONTENT AREA -->
<main id="omega-main" class="omega-main">
  <div id="page-container" class="page-container"></div>
</main>

<!-- OMEGA PLAYER (persistent) -->
<div id="omega-player" class="omega-player hidden">
  <audio id="omega-audio" preload="metadata"></audio>
  <div class="player-art-wrap" onclick="navigate('viewer',{id:OmegaPlayer.currentTrack?.id,type:'audio'})">
    <img id="player-art" src="" alt="" class="player-art">
    <div id="player-art-placeholder" class="player-art-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
  </div>
  <div class="player-info">
    <div id="player-title" class="player-title" onclick="navigate('viewer',{id:OmegaPlayer.currentTrack?.id,type:'audio'})">—</div>
    <div id="player-creator" class="player-creator">—</div>
    <div class="player-progress-wrap">
      <div class="player-progress" id="player-progress-bar" onclick="OmegaPlayer.seek(event)">
        <div class="player-progress-fill" id="player-progress-fill"></div>
      </div>
      <div class="player-times">
        <span id="player-current-time">0:00</span>
        <span id="player-duration">0:00</span>
      </div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn" onclick="OmegaPlayer.prev()" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="player-btn player-btn--play" id="player-play-btn" onclick="OmegaPlayer.togglePlay()" aria-label="Play/Pause">
      <svg id="player-play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="player-pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="player-btn" onclick="OmegaPlayer.next()" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    <div class="player-volume-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
      <input type="range" min="0" max="1" step="0.02" value="1" class="player-volume" id="player-volume" oninput="OmegaPlayer.setVolume(this.value)" aria-label="Volume">
    </div>
    <button class="player-btn player-btn--close" onclick="OmegaPlayer.close()" aria-label="Close player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<!-- MODAL OVERLAY -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="Modal.close()"></div>
<div id="modal-container" class="modal-container hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
